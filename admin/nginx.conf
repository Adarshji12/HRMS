# Serves the console bundle and proxies /api to the API container, so the
# browser only ever talks to one origin. That is what lets a screenshot <img>
# carry the session without CORS or third-party-cookie problems.

# nginx does NOT merge add_header directives down into a location that defines
# its own — it replaces them wholesale. So the security headers below are
# repeated in every block that sets a header of its own. Setting them only at
# server level looks correct and silently ships a page with no protection at
# all, which is exactly what happened the first time this file was written.
# Measured against the running container, not assumed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Screenshot uploads. Must not be lower than the API's own
    # MAX_SCREENSHOT_BYTES, or nginx rejects the request before the API can
    # give the agent a reason it understands.
    client_max_body_size 12m;

    # Applies to any response from a block that adds no header of its own.
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # The console is a single-page app: every path that is not a real file has
    # to return index.html, or a refresh on /settings is a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The document itself must never be cached, or a deploy leaves browsers
    # loading the previous bundle forever.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    # Filenames are content-hashed, so these can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        # Resolved per request, not at startup. With a literal hostname nginx
        # looks "api" up while loading its config and refuses to start at all
        # if it does not resolve yet — so a slow or restarting API takes the
        # whole console down with it, and the container does not recover on its
        # own. Going through a variable defers the lookup, so a missing backend
        # is a 502 on that one request instead of a dead front end.
        resolver 127.0.0.11 ipv6=off valid=10s;   # Docker's embedded DNS
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        # The API reads the tenant from Host, so it has to survive the hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the rate limiter trusts the leftmost
        # value, and appending would let a client forge its own address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Screenshot exports and CSV reports can take a while to assemble.
        proxy_read_timeout 120s;
        proxy_buffering off;

        # No add_header here on purpose: the API sets its own security headers,
        # and adding them again would duplicate every value in the response.
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
