<!--
  Horizontal lockup: mark + wordmark, for README / og:image / marketing headers.

  The original artwork sets the wordmark in a heavy display face that isn't
  licensed into this repo, so the text here renders in the host's grotesque
  stack. In-app the lockup is built in HTML instead (components/Brand.tsx) so it
  inherits the UI font and stays crisp at every zoom level.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="MyDeskTime">
  <title>MyDeskTime</title>
  <defs>
    <linearGradient id="md-lockup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C2BF0"/>
      <stop offset="1" stop-color="#4A0FC0"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 14) scale(0.2168)">
    <rect x="93" y="77" width="340" height="372" rx="64" fill="#14004A"/>
    <rect x="79" y="63" width="340" height="372" rx="64" fill="url(#md-lockup)"/>
    <g fill="none" stroke-linecap="round">
      <g stroke="#14004A" transform="translate(8 8)">
        <path d="M316.7 345.7A118 118 0 1 1 324.9 158.6" stroke-width="20"/>
        <path d="M145 249H249" stroke-width="24"/>
        <path d="M249 249V353" stroke-width="24"/>
        <path d="M249 249L345.4 134.1" stroke-width="24"/>
        <path d="M169.8 227.8A82 82 0 0 1 290 178" stroke-width="7"/>
      </g>
      <g stroke="#FFFFFF">
        <path d="M316.7 345.7A118 118 0 1 1 324.9 158.6" stroke-width="20"/>
        <path d="M145 249H249" stroke-width="24"/>
        <path d="M249 249V353" stroke-width="24"/>
        <path d="M249 249L345.4 134.1" stroke-width="24"/>
        <path d="M169.8 227.8A82 82 0 0 1 290 178" stroke-width="7"/>
      </g>
    </g>
  </g>

  <text x="126" y="90"
        font-family="Segoe UI, -apple-system, system-ui, Helvetica Neue, Arial, sans-serif"
        font-size="66" font-weight="800" letter-spacing="-2.2">
    <tspan fill="#8B6BF0">MyDesk</tspan><tspan fill="#3D0FA6">Time</tspan>
  </text>
</svg>
